<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R HTML</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="titlebar">
        <div class="titlebar-left">
          <img id="logo" class="logo" alt="R HTML" draggable="false" />
          <nav class="menus" id="menus"></nav>
        </div>
        <div class="titlebar-drag" data-tauri-drag-region></div>
        <div class="win-btns">
          <button id="win-min" class="win-btn" title="最小化">
            <svg viewBox="0 0 10 10"><path d="M1 5h8" /></svg>
          </button>
          <button id="win-max" class="win-btn" title="最大化">
            <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="0.5" /></svg>
          </button>
          <button id="win-close" class="win-btn close" title="关闭">
            <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" /></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <section class="editor-pane" id="editor-pane">
          <div class="toolbar">
            <button class="cmd" id="tb-open" title="打开本地 HTML 文件（Ctrl+O）">
              <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3L8 4.5h4.5A1.5 1.5 0 0 1 14 6v6a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12z" /></svg>
              打开
            </button>
            <button class="cmd" id="tb-url" title="打开在线网页（Ctrl+L）">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" /><path d="M2 8h12M8 2c2 1.6 2 10.4 0 12M8 2c-2 1.6-2 10.4 0 12" /></svg>
              网址
            </button>
            <button class="cmd" id="tb-save" title="保存（Ctrl+S）" disabled>
              <svg viewBox="0 0 16 16"><path d="M3 2h8l2 2v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" /><path d="M5 2v3h5V2M5 14v-4h6v4" /></svg>
              保存
            </button>
            <span class="tb-sep"></span>
            <button class="cmd" id="tb-pick" title="选取元素（Ctrl+Shift+C）">
              <svg viewBox="0 0 16 16"><path d="M4 2l9 6-4 .8L11 13l-1.8 1L7 9.5 4.4 12z" /></svg>
              选取元素
            </button>
            <span class="tb-sep"></span>
            <button class="cmd" id="tb-reload" title="重新加载预览（Ctrl+R）">
              <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" /></svg>
              刷新
            </button>
          </div>
          <div class="editor-host" id="editor"></div>
        </section>

        <div class="divider" id="divider"></div>

        <section class="side-pane">
          <div class="tabbar">
            <button class="view-tab active" data-tab="preview">预览</button>
            <button class="view-tab" data-tab="element">元素</button>
          </div>
          <div class="tab-pages">
            <div class="tab-page" id="page-preview">
              <iframe id="preview" title="预览"></iframe>
            </div>
            <div class="tab-page hidden" id="page-element">
              <div class="element-empty" id="element-empty">
                <div class="empty-title">尚未选择元素</div>
                <p>点击左侧「选取元素」，然后在预览中点击任意元素，这里会显示它的标签、选择器和属性。</p>
              </div>
              <div class="element-info hidden" id="element-info"></div>
            </div>
          </div>
        </section>
      </div>

      <footer class="statusbar">
        <div class="status-left">
          <span id="status-doc">未保存的文档</span>
          <span class="status-sep"></span>
          <span id="status-stats"></span>
        </div>
        <div class="status-right">
          <span id="status-flash" class="status-flash"></span>
          <span id="status-version">v0.1.0</span>
          <span class="status-sep"></span>
          <span id="status-mode">编辑</span>
          <button class="status-btn" id="status-theme" title="切换主题">
            <svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z" /></svg>
            <span id="theme-label">浅色</span>
          </button>
          <button class="status-btn" id="status-fs" title="全屏">
            <svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" /></svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="dnd-mask hidden" id="dnd-mask">
      <div class="dnd-text">释放以打开 HTML 文件</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
